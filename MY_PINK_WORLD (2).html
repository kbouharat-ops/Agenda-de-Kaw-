<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>MY PINK WORLD 🌸📱</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ac:#ec5f9a;--ink:#4a3f4f;--font:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,sans-serif;--lab:#4a3f4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);background:#fbe9f1}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 15%,#ffe0ee,transparent 45%),radial-gradient(circle at 85% 90%,#e9dcff,transparent 45%),#fbeef4;
  background-image:radial-gradient(#f0b9d1 1.4px,transparent 1.5px),radial-gradient(circle at 20% 15%,#ffe0ee,transparent 45%),radial-gradient(circle at 85% 90%,#e9dcff,transparent 45%);background-size:22px 22px,auto,auto}
button{font:inherit;color:inherit;cursor:pointer}
#phone{position:relative;width:410px;height:min(860px,97vh);border-radius:56px;border:11px solid #2d2433;box-shadow:0 30px 70px rgba(120,60,100,.35),inset 0 0 0 2px #50435a;overflow:hidden;background:#fff;isolation:isolate}
#screen{position:absolute;inset:0;overflow:hidden;--lab:#4a3f4f}
#screen.dark{--lab:#fff}
#wall{position:absolute;inset:0;background-size:cover;background-position:center}
#wall::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.55) 1.3px,transparent 1.4px);background-size:20px 20px;opacity:.7}
#status{position:absolute;left:0;right:0;top:0;height:38px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:.85rem;color:var(--lab);z-index:5;pointer-events:none}
#status .r{display:flex;gap:7px;align-items:center}
.bars{display:flex;gap:2px;align-items:flex-end;height:11px}.bars i{width:3px;background:currentColor;border-radius:1px}
.bat{width:23px;height:11px;border:1.5px solid currentColor;border-radius:4px;position:relative}.bat::before{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:2px}.bat::after{content:"";position:absolute;right:-4px;top:2.5px;width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0}
#home{position:absolute;inset:0;padding:46px 18px 0;display:flex;flex-direction:column;transition:transform .35s,filter .35s,opacity .35s}
#screen.inapp #home{transform:scale(.92);filter:blur(4px);opacity:.6}
#widget{position:relative;margin:6px 4px 16px;padding:18px 20px 16px;border-radius:30px;background:rgba(255,255,255,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 22px rgba(190,100,150,.18);overflow:hidden}
#clock{font-size:3.3rem;font-weight:800;line-height:1;letter-spacing:-1px;color:var(--ink)}
#date{margin-top:6px;font-weight:700;color:var(--ac)}#screen.dark #widget{background:rgba(255,255,255,.82)}
#greet{margin-top:2px;font-weight:600;font-size:.85rem;color:#7a6a80}
#widget svg{position:absolute;right:16px;top:14px;width:64px;opacity:.9}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px;align-content:start;flex:1;padding:4px 0}
#dock{margin:0 8px 22px;padding:12px 14px;border-radius:32px;background:rgba(255,255,255,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;justify-content:space-around;min-height:84px;box-shadow:0 4px 18px rgba(190,100,150,.15)}
.it{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;min-width:0}
.ic{width:62px;height:62px;border-radius:30%;display:flex;align-items:center;justify-content:center;font-size:1.9rem;box-shadow:0 5px 12px rgba(120,60,100,.2),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .15s}
.round .ic{border-radius:50%}
.it:active .ic{transform:scale(.92)}
.ic.fold{background:rgba(255,255,255,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px;font-size:0}
.ic.fold b{display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:.95rem;font-weight:400}
.lb{font-size:.72rem;font-weight:700;color:var(--lab);text-align:center;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 6px rgba(255,255,255,.35)}
#screen.dark .lb{text-shadow:0 1px 5px rgba(0,0,0,.4)}
#dock .lb{display:none}
@keyframes wig{0%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}100%{transform:rotate(-2.2deg)}}
#screen.editing .it .ic{animation:wig .32s infinite}
#screen.editing .it:nth-child(even) .ic{animation-delay:-.15s}
#screen.editing .lb{text-decoration:underline dotted}
.it.drag{z-index:50;opacity:.85}.it.drag .ic{animation:none;transform:scale(1.12)}
.it.over .ic{outline:3px solid var(--ac);outline-offset:3px}
#done{position:absolute;top:8px;right:18px;z-index:9;border:0;background:rgba(255,255,255,.85);color:var(--ac);font-weight:800;padding:6px 14px;border-radius:99px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
#folder{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(80,40,70,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fin .25s}
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#fbox{width:84%;min-height:250px;border-radius:38px;padding:20px 16px 26px;background:rgba(255,255,255,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(100,40,80,.3);animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
#fname{display:block;width:100%;text-align:center;font:800 1.2rem var(--font);color:var(--ink);background:transparent;border:0;border-bottom:2px dashed transparent;padding:4px;margin-bottom:16px}
#screen.editing #fname{border-bottom-color:var(--ac)}
#fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 4px}
#fempty{text-align:center;color:#8a7a90;font-weight:600;padding:20px 0}
#win{position:absolute;inset:0;z-index:30;background:#fff;transform-origin:var(--ox,50%) var(--oy,50%);animation:wopen .38s cubic-bezier(.2,.9,.3,1) both}
#win.closing{animation:wclose .3s ease-in both}
@keyframes wopen{from{transform:scale(.15);opacity:0;border-radius:40px}to{transform:scale(1);opacity:1;border-radius:0}}
@keyframes wclose{to{transform:scale(.15);opacity:0;border-radius:40px}}
#win.full{position:fixed;z-index:200}
.fr{width:100%;height:100%;border:0;display:block;background:#fff}
#panel{position:absolute;inset:0;overflow:auto;padding:54px 18px 46px;background:linear-gradient(180deg,#fff7fb,#fff)}
#panel h1{margin:0 0 4px;font-size:1.5rem;font-weight:800}
#panel .sub{color:#8a7a90;font-weight:600;font-size:.85rem;margin-bottom:16px}
#panel h2{font-size:.78rem;letter-spacing:.8px;text-transform:uppercase;color:var(--ac);margin:22px 0 10px;font-weight:800}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{aspect-ratio:1;border-radius:20px;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.14);cursor:pointer;position:relative}
.sw.on{outline:3px solid var(--ac)}
.wg2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.wg2 .sw{aspect-ratio:3/4}
.btn{border:0;background:var(--ac);color:#fff;font-weight:800;padding:11px 18px;border-radius:99px;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.btn.soft{background:#fbe3ee;color:var(--ac);box-shadow:none}
.btn.line{background:#fff;color:var(--ink);border:1.5px solid #e6d9e2;box-shadow:none}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f3e6ee}
.row .mini{width:38px;height:38px;border-radius:30%;display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex:none}
.round .row .mini{border-radius:50%}
.row .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select,input[type=text]{font:600 .9rem var(--font);color:var(--ink);padding:8px 10px;border-radius:12px;border:1.5px solid #e6d9e2;background:#fff;max-width:100%}
input[type=text]{width:100%}
input[type=color]{width:46px;height:36px;border:0;background:none;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #e6d9e2;background:#fff;border-radius:99px;padding:8px 14px;font-weight:700}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.dots{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.dots.on{outline:3px solid var(--ink)}
.emo{font-size:1.35rem;width:42px;height:42px;border-radius:14px;border:1.5px solid #eee;background:#fff}
.emo.on{border-color:var(--ac);background:#fff0f6}
.prev{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.prev .ic{width:72px;height:72px}
#pill{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:130px;height:22px;z-index:60;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
#pill i{display:block;width:118px;height:5px;border-radius:9px;background:var(--lab);opacity:.55}
#pill span{display:none}
#screen.inapp #pill i{display:none}
#screen.inapp #pill{width:auto;height:auto;padding:7px 16px;border-radius:99px;background:rgba(45,36,51,.82);color:#fff;bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.28);opacity:.88}
#screen.inapp #pill:hover{opacity:1}
#screen.inapp #pill span{display:block;font:800 .78rem var(--font)}
#pill.fixed{position:fixed;bottom:10px;z-index:300}
#dlgbg{position:absolute;inset:0;z-index:80;background:rgba(60,30,50,.35);display:flex;align-items:center;justify-content:center;padding:24px}
#dlg{background:#fff;border-radius:26px;padding:20px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .22s}
#dlg h3{margin:0 0 12px}
#dlg .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:#3a2f40;color:#fff;font-weight:700;padding:9px 16px;border-radius:99px;z-index:90;font-size:.85rem;white-space:nowrap;animation:fin .2s}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.4rem;background:#fff7fb;pointer-events:none;animation:fin .2s}
@media (max-width:560px),(max-height:520px){
  #phone{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}
  body{background:#fbe9f1}
}
</style>
</head>

2px;\n  color:var(--ink); font:500 15px/1.5 var(--font-ui);\n  padding-block:18px 40px;\n  padding-left:max(16px,env(safe-area-inset-left,0px));\n  padding-right:max(16px,env(safe-area-inset-right,0px));\n}\nbody.lock{overflow:hidden}\n.page{max-width:1220px;margin:0 auto;display:grid;gap:16px}\nbutton,input,select,textarea{font:inherit;color:inherit}\nbutton{cursor:pointer}\n:focus-visible{outline:2.5px solid var(--rose);outline-offset:2px;border-radius:6px}\n.ic{width:1em;height:1em;display:inline-block;flex:none;vertical-align:-.14em}\n.ic.big{width:24px;height:24px}\n\n/* Header */\n.top{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;\n  background:var(--pink);border-radius:24px;padding:18px 22px;overflow:hidden}\n.brand{position:relative;z-index:1;min-width:0}\n.logo{display:flex;align-items:center;gap:10px;margin:0;font:600 clamp(1.8rem,5.2vw,2.5rem)/1.15 var(--font-display);color:var(--pink-ink)}\n.logo .ic{width:.7em;height:.7em}\n.tag{margin:4px 0 0 2px;font:600 .68rem var(--font-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}\n.top-r{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px}\n.deco{position:absolute;pointer-events:none;opacity:.8}\n.pill-sync{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:7px 14px;font:600 .8rem var(--font-ui);color:var(--muted)}\n.pill-sync i{width:9px;height:9px;border-radius:50%;background:var(--powder)}\n.pill-sync.synced i{background:#5DBB8A}\n.pill-sync.saving i{background:var(--rose);animation:pulse 1s infinite}\n.pill-sync.offline i,.pill-sync.readonly i{background:#E2A04C}\n@keyframes pulse{50%{opacity:.35}}\n\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:9px 16px;\n  font:600 .92rem var(--font-ui);border:1.5px solid var(--line);background:var(--paper);color:var(--ink);transition:background .15s,border-c \n  return (t.title+' '+t.desc+' '+CATS[t.cat]).toLowerCase().indexOf(q)>=0;\n}\nfunction byTime(a,b){\n  return ((a.cat==='festivo')?0:1)-((b.cat==='festivo')?0:1)\n    || (a.time||'99:99').localeCompare(b.time||'99:99')\n    || a.title.localeCompare(b.title,'es');\n}\nfunction byDateAsc(a,b){return a.date.localeCompare(b.date)||(a.time||'99:99').localeCompare(b.time||'99:99')||a.title.localeCompare(b.title,'es')}\nfunction byDateDesc(a,b){return b.date.localeCompare(a.date)||a.title.localeCompare(b.title,'es')}\nfunction tasksOn(list,d){return list.filter(function(t){return t.date<=d&&(t.end||t.date)>=d}).sort(byTime)}\nfunction plural(n,one,many){return n+' '+(n===1?one:many)}\n\n/* ---------- Toast ---------- */\nvar toastTimer;\nfunction toast(msg){\n  var el=$('#toast');\n  el.textContent=msg;el.classList.add('show');\n  clearTimeout(toastTimer);\n  toastTimer=setTimeout(function(){el.classList.remove('show')},2400);\n}\n\n/* ---------- Persistence ---------- */\nfunction saveLocal(){\n  try{\n    var data=all().map(function(t){return t});\n    localStorage.setItem(LOCAL_KEY,JSON.stringify(data));\n  }catch(e){}\n}\nfunction loadLocal(){\n  try{\n    var raw=JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]');\n    S.tasks=new Map();\n    raw.forEach(function(r){var t=normalize(r.id||newId(),r);if(t)S.tasks.set(t.id,t)});\n  }catch(e){}\n}\nfunction enqueue(id,fn){\n  var prev=queue.get(id)||Promise.resolve();\n  var p=prev.catch(function(){}).then(fn);\n  queue.set(id,p.catch(function(){}));\n  return p;\n}\nfunction fail(e){\n  if(e&&e.code==='invalid_argument'){S.canWrite=false;S.sync='readonly'}\n  toast(S.canWrite?'No se pudo guardar. Inténtalo de nuevo.':'No tienes permiso para cambiar la agenda.');\n  renderAll();\n  return false;\n}\nfunction bodyOf(t){\n  return {title:t.title,desc:t.desc,cat:t.cat,date:t.date,end:t.end||'',time:t.time||'',done:!!t.done,important:!!t.important,updatedAt:Date.now()};\n}\nasync function persist(t){\n  var body=bodyOf(t);\n  if(S.col){\n    try{await enqueue(t.id,function(){return S.col.doc(t.id).set(body)});return true}\n    catch(e){return fail(e)}\n  }\n  var n=normalize(t.id,body);\n  S.tasks.set(t.id,n);saveLocal();renderAll();return true;\n}\nasync function removeTask(id){\n  if(S.col){\n    try{await enqueue(id,function(){return S.col.doc(id).delete()});return true}\n    catch(e){return fail(e)}\n  }\n  S.tasks.delete(id);saveLocal();renderAll();return true;\n}\nfunction toggleDone(id){\n  var t=S.tasks.get(id);if(!t||!S.canWrite)return;\n  var nd=!t.done;\n  persist(Object.assign({},t,{done:nd})).then(function(ok){if(ok)toast(nd?'¡Tarea completada!':'Vuelve a estar pendiente')});\n}\nfunction toggleStar(id){\n  var t=S.tasks.get(id);if(!t||!S.canWrite)return;\n  persist(Object.assign({},t,{important:!t.important}));\n}\n\n/* ---------- Rendering ---------- */\nfunction renderAll(){\n  renderStats();renderCal();renderExams();renderLists();renderSync();renderNote();renderListView();renderNotebook(true);\n  if(modal.date)renderModal(false);\n}\nfunction renderSync(){\n  var map={loading:'Conectando…',synced:'Guardado y sincronizado',saving:'Guardando…',local:'Solo en este dispositivo',offline:'Sin conexión con la agenda',readonly:'Solo lectura'};\n  var el=$('#sync');\n  el.className='pill-sync '+S.sync;\n  $('#sync-t').textContent=map[S.sync]||'';\n  var b=$('#banner');\n  if(S.mode==='local'){b.hidden=false;b.textContent='Modo local: tus tareas se guardan solo en este navegador y no se comparten. Abre la agenda desde su enlace para sincronizarla.'}\n  else if(!S.canWrite){b.hidden=false;b.textContent='Tienes acceso de solo lectura: puedes ver la agenda, pero no cambiarla.'}\n  else b.hidden=true;\n  $('#btn-new').hidden=!S.canWrite;\n}\nfunction renderStats(){\n  var list=all().filter(function(t){return t.cat!=='festivo'});\n  $('#st-notes').textContent=N.notes.size;\n  $('#st-pend').textContent=list.filter(function(t){return !t.done}).length;\n  $('#st-done').textContent=list.filter(function(t){return t.done}).length;\n  var ex=nextExams();\n  var el=$('#st-exam');\n  if(!ex.length)el.textContent='Sin exámenes a la vista';\n  else{\n    var d=dayDiff(ex[0].date,today);\n    el.textContent='Próximo examen '+(d<=0?'hoy':d===1?'mañana':'en '+d+' días');\n  }\n}\nfunction nextExams(){\n  return all().filter(function(t){return t.cat==='examen'&&!t.done&&(t.end||t.date)>=today}).sort(byDateAsc);\n}\nfunction chip(t){\n  return h('span',{class:'chip cat-'+t.cat+(t.cat==='festivo'?'':(t.done?' done':' pend'))},\n    t.cat!=='festivo'?ic(t.done?'check':'heart-half'):null,\n    t.important?ic('star'):null,\n    h('span',{class:'t'},(t.time?t.time+' ':'')+t.title));\n}\nfunction renderCal(){\n  var y=view.y,m=view.m;\n  var sy=$('#sel-year');\n  if(!sy.querySelector('option[value=\"'+y+'\"]')){\n    sy.appendChild(h('option',{value:String(y)},String(y)));\n  }\n  $('#sel-month').value=String(m);sy.value=String(y);\n  var first=new Date(y,m,1),lead=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate();\n  var rows=Math.ceil((lead+dim)/7),total=rows*7;\n  var list=all().filter(matches);\n  var grid=$('#grid');grid.replaceChildren();\n  DOWS.forEach(function(d){grid.append(h('div',{class:'dow'},h('span',{class:'l'},d[0]),h('span',{class:'s'},d[1])))});\n  for(var i=0;i<total;i++){\n    var d=new Date(y,m,1-lead+i);\n    var dsn=ds(d.getFullYear(),d.getMonth(),d.getDate());\n    var items=tasksOn(list,dsn);\n    var hol=items.some(function(t){return t.cat==='festivo'});\n    var label=fmtLong(dsn)+(items.length?', '+plural(items.length,'tarea','tareas'):'');\n    grid.append(h('button',{type:'button',class:'day'+(d.getMonth()!==m?' out':'')+(dsn===today?' today':'')+(hol?' holiday':''),'data-date':dsn,'aria-label':label},\n      h('span',{class:'num'},String(d.getDate())),\n      h('span',{class:'chips'},items.slice(0,3).map(function(t){return chip(t)}),items.length>3?h('span',{class:'more'},'+'+(items.length-3)+' más'):null),\n      h('span',{class:'dots'},items.slice(0,6).map(function(t){return h('i',{class:'dot cat-'+t.cat+(t.cat==='festivo'?'':(t.done?' done':' pend'))})}))\n    ));\n  }\n}\nfunction renderExams(){\n  var box=$('#exams');box.replaceChildren();\n  var ex=nextExams().slice(0,4);\n  if(!ex.length){\n    box.append(h('p',{class:'empty'},S.loaded||S.mode==='local'?'No hay exámenes próximos. Añade uno con la categoría Examen.':'Cargando tu agenda…'));\n    return;\n  }\n  var ul=h('ul',{class:'list'});\n  ex.forEach(function(t){\n    var d=dayDiff(t.date,today);\n    var when=d<0?'en curso':d===0?'hoy':d===1?'mañana':'en '+d+' días';\n    var p=parse(t.date);\n    ul.append(h('li',null,h('button',{type:'button',class:'exam',onclick:function(ev){openFromList(t,ev.currentTarget)}},\n      h('span',{class:'leaf'},h('small',null,p.toLocaleDateString('es-ES',{month:'short'}).replace('.','')),h('b',null,String(p.getDate()))),\n      h('span',null,h('span',{class:'tt'},t.title),h('span',{class:'sub'},when+(t.time?' · '+t.time:'')))\n    )));\n  });\n  box.append(ul);\n}\nfunction dateLabel(t){\n  return t.end&&t.end!==t.date?fmtShort(t.date)+' → '+fmtShort(t.end):fmtShort(t.date);\n}\nfunction row(t,opts){\n  opts=opts||{};\n  var isF=t.cat==='festivo';\n  var overdue=!t.done&&!isF&&(t.end||t.date)<today;\n  var st=isF?h('span',{class:'cdot cat-'+t.cat,'aria-hidden':'true'}):\n    h('button',{type:'button',class:'st',disabled:!S.canWrite,'aria-pressed':String(t.done),\n      'aria-label':(t.done?'Completada: ':'Pendiente: ')+t.title+'. Pulsa para cambiar',\n      title:t.done?'Completada. Pulsa para marcar pendiente':'Pendiente. Pulsa para completar',\n      onclick:function(){toggleDone(t.id)}},ic(t.done?'check':'heart-half','big'));\n  var meta=[opts.showDate===false?null:dateLabel(t),t.time||null].filter(Boolean).join(' · ');\n  var metaEl=h('span',{class:'r-meta cat-'+t.cat},meta?meta+' · ':'',h('span',{class:'cat'},CATS[t.cat]),overdue?' · Vencida':'');\n  var kids=[h('span',{class:'r-title'},t.important?ic('star'):null,h('span',null,t.title)),metaEl];\n  if(opts.modal&&t.desc)kids.push(h('span',{class:'r-desc'},t.desc));\n  var main=opts.modal?h.apply(null,['div',{class:'r-main'}].concat(kids)):\n    h.apply(null,['button',{type:'button',class:'r-main',onclick:function(ev){openFromList(t,ev.currentTarget)}}].concat(kids));\n  var acts=null;\n  if(opts.modal&&S.canWrite){\n    acts=h('div',{class:'r-acts'},\n      h('button',{type:'button',class:'mini','aria-pressed':String(t.important),'aria-label':t.important?'Quitar importante':'Marcar como importante',title:'Importante',onclick:function(){toggleStar(t.id)}},ic('star')),\n      h('button',{type:'button',class:'mini','aria-label':'Editar '+t.title,title:'Editar',onclick:function(){startEdit(t.id)}},ic('pencil')),\n      delBtn(function(){removeTask(t.id).then(function(ok){if(ok){toast('Tarea eliminada');if(modal.editId===t.id)resetForm(modal.date)}})},\n        [ic('trash')],'¿Eliminar?','mini','Eliminar '+t.title)\n    );\n  }\n  return h('li',{class:'row cat-'+t.cat+(t.done?' done':'')+(!t.done&&!isF?' pend':'')+(overdue?' overdue':'')+(opts.past?' past':'')},st,main,acts);\n}\nfunction delBtn(run,idleKids,sureText,cls,label){\n  var btn=h('button',{type:'button',class:cls+' del','aria-label':label,title:'Eliminar'},\n    h('span',{class:'idle'},idleKids),h('span',{class:'sure'},sureText));\n  var timer;\n  btn.addEventListener('click',function(){\n    if(btn.classList.contains('armed')){clearTimeout(timer);run();return}\n    btn.classList.add('armed');\n    timer=setTimeout(function(){btn.classList.remove('armed')},3500);\n  });\n  return btn;\n}\nfunction renderLists(){\n  var nonF=all().filter(function(t){return t.cat!=='festivo'});\n  var nPend=nonF.filter(function(t){return !t.done}).length,nDone=nonF.filter(function(t){return t.done}).length;\n  var nFest=all().filter(function(t){return t.cat==='festivo'}).length;\n  $('#tab-pending').textContent='Pendientes ('+nPend+')';\n  $('#tab-done').textContent en','Con Mayús en el aire usas el gas para impulsarte hacia delante. Cuidado: se acaba y solo se recarga en el suelo. Sigue las columnas de luz.']]},\n {t:'El informe de Tomi',d:'Habla con Tomi Alder en la biblioteca, al oeste de la plaza.',k:'talk',npc:'tomi',xp:60,\n  lines:[['Tomi Alder','¡Lo has hecho genial! He estudiado a los gigantes durante años y sé algo que casi nadie sabe.'],['Tomi Alder','Todos tienen un punto débil en la nuca: un brillo rojo bajo el pelo. Un tajo ahí y caen al instante. En cualquier otra parte solo les haces cosquillas.'],['Tomi Alder','Para llegar a la nuca hay que subir: engánchate a ellos, a los árboles o salta desde las alturas. Y ataca con F cuando estés cerca.']]},\n {t:'Primera salida',d:'Cruza la puerta sur del Muro y derrota a 3 gigantes. Golpea la nuca (brillo rojo) con F.',k:'kill',n:3,xp:200,\n  brief:[['Capitana Ondar','Hay gigantes errantes al sur, a poca distancia de la puerta. Sal, derriba a tres y vuelve de una pieza.'],['Capitana Ondar','Si tu vida baja, Doc Mirel te curará junto a la puerta. ¡Y no te quedes en el suelo: los gigantes no te alcanzan en el aire!']]},\n {t:'El secreto de Doc Mirel',d:'Habla con Doc Mirel, junto a la puerta sur.',k:'talk',npc:'mirel',xp:100,\n  lines:[['Doc Mirel','Ah, ya has vuelto. Y por tu cara, has visto de cerca lo que son. Siéntate, que te curo.'],['Doc Mirel','Hay algo más. Tu sangre reacciona a la piedra del Muro. En un reclutamiento de hace siglos, algunos despertaban el poder del Gólem de Piedra.'],['Doc Mirel','Cuando tengas energía de sobra, pulsa T: te transformarás en un gigante de roca durante unos segundos. Pegas fuerte, aguantas mucho… pero no puedes usar los ganchos.']]},\n {t:'Despierta al Gólem',d:'Pulsa T con al menos 50 de energía para convertirte en el Gólem de Piedra.',k:'golem',xp:200,\n  brief:[['Sira Valen','Respira. Reúne energía y deja que la piedra responda. Estaré a tu lado.']]},\n {t:'Suministros perdidos',d:'Recupera las 3 cajas de suministros perdidas fuer var S=defState(),editing=false,openF=null,saveTm=null,remoteOK=false;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------- Guardado (Neon vía /api/data, copia local) ---------- */
function api(method,body){var ac=window.AbortController?new AbortController():null,tm=ac&&setTimeout(function(){ac.abort()},5000);
  return fetch('/api/data?c=game&id=world',{method:method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:ac?ac.signal:undefined}).then(function(r){clearTimeout(tm);if(!r.ok)throw new Error(r.status);return r.json()})}
function merge(s){var d=defState();if(!s||typeof s!=='object')return d;
  var o=Object.assign({},d,s);o.apps=Object.assign({},d.apps,s.apps||{});o.folders=s.folders||d.folders;o.home=s.home||d.home;o.dock=s.dock||d.dock;
  if(s&&s.apps&&!s.apps.tax&&!o.folders.f4){o.folders.f4={n:'Finanzas',items:['tax','exp']};if(o.home.indexOf('f4')<0)o.home.splice(Math.min(2,o.home.length),0,'f4')}
  // limpieza de referencias rotas
  var ok=function(id){return !!o.apps[id]};
  Object.keys(o.folders).forEach(function(k){o.folders[k].items=(o.folders[k].items||[]).filter(ok)});
  o.home=o.home.filter(function(id){return o.folders[id]||ok(id)});o.dock=o.dock.filter(ok);
  // apps que no aparecen en ningún sitio vuelven a su carpeta por defecto
  var seen={};o.home.forEach(function(i){seen[i]=1});o.dock.forEach(function(i){seen[i]=1});Object.keys(o.folders).forEach(function(k){o.folders[k].items.forEach(function(i){seen[i]=1})});
  Object.keys(o.apps).forEach(function(a){if(!seen[a]){var tgt=o.apps[a].p?'f3':(a==='game'?'f2':(a==='tax'||a==='exp'?'f4':'f1'));if(o.folders[tgt])o.folders[tgt].items.push(a);else o.home.push(a)}});
  return o}
function save(){S.t=Date.now();clearTimeout(saveTm);saveTm=setTimeout(function(){
  try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}
  api('PUT',S).then(function(){remoteOK=true}).catch(function(){remoteOK=false})},500)}
function load(){
  var loc=null;try{loc=JSON.parse(localStorage.getItem(SK)||'null')}catch(e){}
  if(loc)S=merge(loc);
  api('GET').then(function(r){var it=(r.items||[]).filter(function(x){return x.id==='world'})[0];
    if(it&&it.data&&(!loc||it.data.t>(loc.t||0))){S=merge(it.data);try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}paint()}remoteOK=true}).catch(function(){})}

/* ---------- Utilidades ---------- */
function toast(m){var t=document.createElement('div');t.id='toast';t.textContent=m;var o=$('#toast');if(o)o.remove();$('#screen').appendChild(t);setTimeout(function(){t.remove()},1900)}
function ask(title,val,cb){var bg=document.createElement('div');bg.id='dlgbg';bg.innerHTML='<div id="dlg"><h3>'+esc(title)+'</h3><input type="text" maxlength="24" value="'+esc(val)+'"><div class="bt"><button class="btn line">Cancelar</button><button class="btn">Guardar</button></div></div>';
  $('#screen').appendChild(bg);var inp=bg.querySelector('input');inp.focus();inp.select();
  var close=function(){bg.remove()};bg.querySelector('.line').onclick=close;
  var ok=function(){var v=inp.value.trim();if(v)cb(v.slice(0,24));close()};bg.querySelector('.btn:not(.line)').onclick=ok;inp.onkeydown=function(e){if(e.key==='Enter')ok();if(e.key==='Escape')close()}}
function isDark(){return S.wall.k==='g'&&GRADS[S.wall.v]&&GRADS[S.wall.v][2]===1}

/* ---------- Pintado ---------- */
function paint(){
  var sc=$('#screen');sc.classList.toggle('dark',isDark());sc.classList.toggle('editing',editing);$('#phone').classList.toggle('round',S.shape==='circle');
  document.documentElement.style.setProperty('--ac',S.acc);
  var w=$('#wall');if(S.wall.k==='g'){w.style.background=GRADS[S.wall.v||0][1]}
  else if(S.wall.k==='c'){w.style.background='linear-gradient(160deg,'+S.wall.v+','+S.wall.v+')'}
  else{var im=null;try{im=localStorage.getItem(IK)}catch(e){}w.style.background=im?'url('+im+') center/cover':GRADS[0][1]}
  $('#greet').textContent='Hola, '+S.name+' 🌸';
  tick();drawGrid();drawDock();if(openF)drawFolder();$('#done').hidden=!editing}
function iconEl(id,list){
  var f=S.folders[id],d=document.createElement('div');d.className='it';d.dataset.id=id;d.dataset.list=list;
  if(f){var prev=f.items.slice(0,4).map(function(a){var A=S.apps[a];return'<b style="background:'+A.c+'">'+esc(A.e)+'</b>'}).join('');
    d.innerHTML='<div class="ic fold">'+prev+'</div><div class="lb">'+esc(f.n)+'</div>'}
  else{var A=S.apps[id];d.innerHTML='<div class="ic" style="background:linear-gradient(145deg,'+A.c+',color-mix(in srgb,'+A.c+' 80%,#fff))">'+esc(A.e)+'</div><div class="lb">'+esc(A.n)+'</div>'}
  bind(d);return d}
function drawGrid(){var g=$('#grid');g.innerHTML='';S.home.forEach(function(id){g.appendChild(iconEl(id,'home'))})}
function drawDock(){var g=$('#dock');g.innerHTML='';S.dock.forEach(function(id){g.appendChild(iconEl(id,'dock'))})}
function drawFolder(){var f=S.folders[openF];if(!f){closeFolder();return}$('#fname').value=f.n;$('#fname').readOnly=!editing;var g=$('#fgrid');g.innerHTML='';
  if(!f.items.length){g.innerHTML='<div id="fempty" style="grid-column:1/-1">Carpeta vacía</div>'}
  f.items.forEach(function(id){g.appendChild(iconEl(id,'f:'+openF))})}
function tick(){var d=new Date(),h=d.getHours(),m=('0'+d.getMinutes()).slice(-2),t=h+':'+m;$('#clock').textContent=t;$('#stime').textContent=t;
  var ds=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});$('#date').textContent=ds.charAt(0).toUpperCase()+ds.slice(1)}
setInterval(tick,15000);

/* ---------- Interacción: toque, pulsación larga, arrastre ---------- */
function listOf(l){return l==='home'?S.home:l==='dock'?S.dock:S.folders[l.slice(2)].items}
function bind(el){
  var sx,sy,down=false,moved=false,lp=null,lpFired=false,pid;
  el.addEventListener('pointerdown',function(e){if(e.button>0)return;down=true;moved=false;lpFired=false;sx=e.clientX;sy=e.clientY;pid=e.pointerId;
    if(!editing)lp=setTimeout(function(){lpFired=true;setEdit(true)},520)});
  el.addEventListener('pointermove',function(e){if(!down)return;var dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved&&Math.hypot(dx,dy)>7){if(!editing){clearTimeout(lp);down=false;return}moved=true;el.classList.add('drag');try{el.setPointerCapture(pid)}catch(_){}}
    if(moved){el.style.transform='translate('+dx+'px,'+dy+'px)';markOver(el,e.clientX,e.clientY)}});
  var end=function(e){if(!down)return;down=false;clearTimeout(lp);
    if(moved){var tgt=dropTarget(el,e.clientX,e.clientY);el.classList.remove('drag');el.style.transform='';clearOver();commitDrop(el,tgt,e.clientX,e.clientY);return}
    if(lpFired)return;
    if(editing){return}
    activate(el.dataset.id,el)};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',function(){down=false;clearTimeout(lp);el.classList.remove('drag');el.style.transform='';clearOver()});
  el.querySelector('.lb').addEventListener('click',function(ev){if(editing){ev.stopPropagation();renameItem(el.dataset.id)}});
  el.addEventListener('contextmenu',function(e){e.preventDefault()})}
function sibs(el){return Array.prototype.slice.call(document.querySelectorAll('.it')).filter(function(x){return x!==el&&x.dataset.list===el.dataset.list})}
function hit(r,x,y){return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
function dropTarget(el,x,y){
  var all=Array.prototype.slice.call(document.querySelectorAll('.it')).filter(function(i){return i!==el&&i.offsetParent!==null});
  for(var i=0;i<all.length;i++){if(hit(all[i].getBoundingClientRect(),x,y))return all[i]}return null}
function markOver(el,x,y){clearOver();var t=dropTarget(el,x,y);if(t)t.classList.add('over')}
function clearOver(){document.querySelectorAll('.it.over').forEach(function(i){i.classList.remove('over')})}
function removeFrom(l,id){var a=listOf(l),i=a.indexOf(id);if(i>=0)a.splice(i,1)}
function commitDrop(el,tgt,x,y){
  var id=el.dataset.id,from=el.dataset.list;
  if(openF&&from==='f:'+openF&&!hit($('#fbox').getBoundingClientRect(),x,y)&&!S.folders[id]){ // sacar de la carpeta
    removeFrom(from,id);S.home.push(id);save();paint();toast('Movida a la pantalla de inicio');return}
  if(tgt){var tid=tgt.dataset.id,tl=tgt.dataset.list;
    if(S.folders[tid]&&!S.folders[id]&&tl==='home'){removeFrom(from,id);S.folders[tid].items.push(id);save();paint();toast('Movida a «'+S.folders[tid].n+'»');return}
    if(S.folders[id]&&tl!=='home')return; // las carpetas solo viven en inicio
    if(from===tl){var a=listOf(from),i=a.indexOf(id),j=a.indexOf(tid);a.splice(i,1);a.splice(j,0,id);save();paint();return}
    if(!S.folders[id]){if(tl==='dock'&&S.dock.length>=4){toast('El dock admite 4 apps');paint();return}removeFrom(from,id);var c=listOf(tl),k=c.indexOf(tid);c.splice(k,0,id);save();paint();return}}
  paint()}
function setEdit(v){editing=v;if(v&&navigator.vibrate)try{navigator.vibrate(15)}catch(e){}$('#screen').classList.toggle('editing',v);$('#done').hidden=!v;if(openF)$('#fname').readOnly=!v;if(!v)save()}
$('#done').onclick=function(){setEdit(false)};
function renameItem(id){var f=S.folders[id];if(f)ask('Nombre de la carpeta',f.n,function(v){f.n=v;save();paint()});else{var A=S.apps[id];ask('Nombre de la aplicación',A.n,function(v){A.n=v;save();paint()})}}
$('#fname').addEventListener('change',function(){var v=this.value.trim();if(v&&openF){S.folders[openF].n=v.slice(0,22);save();paint()}});

/* ---------- Carpetas ---------- */
function openFolder(id){openF=id;$('#folder').hidden=false;drawFolder()}
function closeFolder(){openF=null;$('#folder').hidden=true;paint()}
$('#folder').addEventListener('pointerdown',function(e){if(e.target===this)closeFolder()});

/* ---------- Apps ---------- */
var cur=null;
function activate(id,el){
  if(S.folders[id]){openFolder(id);return}
  var A=S.apps[id];if(!A)return;
  var r=el.getBoundingClientRect(),pr=$('#screen').getBoundingClientRect();
  openApp(id,(r.left+r.width/2-pr.left)+'px',(r.top+r.height/2-pr.top)+'px')}
function openApp(id,ox,oy){
  var A=S.apps[id];cur=id;var win=$('#win'),pan=$('#panel');
  win.style.setProperty('--ox',ox||'50%');win.style.setProperty('--oy',oy||'50%');
  win.classList.remove('closing');win.hidden=false;
  var wide=!!A.wide&&innerWidth>=700;win.classList.toggle('full',wide);$('#pill').classList.toggle('fixed',wide);
  $('#screen').classList.add('inapp');
  Object.keys(frames).forEach(function(k){frames[k].hidden=true});
  if(A.url){pan.hidden=true;var f=frameFor(id,A);f.hidden=false;$('#load').hidden=!!f._ok;if(f._ok){try{f.contentWindow.focus()}catch(e){}}}
  else{$('#load').hidden=true;pan.hidden=false;pan.scrollTop=0;PANELS[A.p](pan)}}
var frames={};
function frameFor(id,A){var f=frames[id];if(f)return f;
  f=document.createElement('iframe');f.className='fr';f.title=A.n;f.setAttribute('allow','fullscreen; pointer-lock');f.hidden=true;
  f.onload=function(){f._ok=1;if(!f.hidden){$('#load').hidden=true;try{f.contentWindow.focus()}catch(e){}}};
  $('#win').insertBefore(f,$('#panel'));
  if(window.__EMBED&&window.__EMBED[A.url])f.srcdoc=window.__EMBED[A.url];else f.src=A.url;
  frames[id]=f;return f}
function closeApp(){if(!cur)return;var win=$('#win');win.classList.add('closing');
  setTimeout(function(){win.hidden=true;win.classList.remove('closing','full');$('#pill').classList.remove('fixed');$('#screen').classList.remove('inapp');cur=null;paint()},280)}
$('#pill').onclick=function(){if(cur)closeApp();else if(editing)setEdit(false);else if(openF)closeFolder()};
addEventListener('message',function(e){if(e.data&&e.data.type==='home')closeApp()});
addEventListener('keydown',function(e){if(e.key==='Escape'&&!cur){if(editing)setEdit(false);else if(openF)closeFolder()}});

/* ---------- Paneles integrados ---------- */
function head(t,s){return'<h1>'+t+'</h1><div class="sub">'+s+'</div>'}
var PANELS={
 wall:function(p){
  var h=head('🖼️ Fondos','Elige el fondo de tu pantalla de inicio.')+'<h2>Degradados</h2><div class="wgrid">';
  GRADS.forEach(function(g,i){h+='<div class="sw'+(S.wall.k==='g'&&S.wall.v===i?' on':'')+'" data-g="'+i+'" title="'+g[0]+'" style="background:'+g[1]+'"></div>'});
  h+='</div><h2>Color liso</h2><div class="row" style="border:0"><input type="color" id="wc" value="'+(S.wall.k==='c'?S.wall.v:'#ffd3e5')+'"><span class="nm" style="color:#8a7a90">Elige cualquier color</span><button class="btn soft" id="wcb">Aplicar</button></div>'
  +'<h2>Tu foto</h2><div class="row" style="border:0"><span class="nm" style="color:#8a7a90">Sube una imagen de tu dispositivo</span><button class="btn" id="wf">Elegir foto</button></div><input type="file" id="wfi" accept="image/*" hidden>';
  p.innerHTML=h;
  p.querySelectorAll('[data-g]').forEach(function(e){e.onclick=function(){S.wall={k:'g',v:+e.dataset.g};save();paint();PANELS.wall(p)}});
  $('#wcb').onclick=function(){S.wall={k:'c',v:$('#wc').value};save();paint();toast('Fondo aplicado')};
  $('#wf').onclick=function(){$('#wfi').click()};
  $('#wfi').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    var d=c.toDataURL('image/jpeg',.78);try{localStorage.setItem(IK,d);S.wall={k:'i'};save();paint();toast('Foto aplicada ✓ (se guarda en este dispositivo)')}catch(e){toast('La foto es demasiado grande')}};im.src=r.result};r.readAsDataURL(f)}},
 colors:function(p){
  var h=head('🎨 Colores','Cambia el color de detalle y la forma de los iconos.')+'<h2>Color principal</h2><div class="chips">';
  ACCS.forEach(function(c){h+='<div class="dots'+(S.acc===c?' on':'')+'" data-a="'+c+'" style="background:'+c+'"></div>'});
  h+='<input type="color" id="ac" value="'+S.acc+'"></div><h2>Forma de los iconos</h2><div class="chips"><button class="chip'+(S.shape==='sq'?' on':'')+'" data-s="sq">Redondeados</button><button class="chip'+(S.shape==='circle'?' on':'')+'" data-s="circle">Círculos</button></div>'
  +'<h2>Tu nombre</h2><input type="text" id="nm" maxlength="16" value="'+esc(S.name)+'">';
  p.innerHTML=h;
  p.querySelectorAll('[data-a]').forEach(function(e){e.onclick=function(){S.acc=e.dataset.a;save();paint();PANELS.colors(p)}});
  $('#ac').onchange=function(){S.acc=this.value;save();paint();PANELS.colors(p)};
  p.querySelectorAll('[data-s]').forEach(function(e){e.onclick=function(){S.shape=e.dataset.s;save();paint();PANELS.colors(p)}});
  $('#nm').onchange=function(){S.name=this.value.trim()||'Kaw';save();paint()}},
 icons:function(p,sel){
  var ids=Object.keys(S.apps);
  if(!sel){var h=head('✨ Iconos','Toca una aplicación para cambiar su nombre, emoji y color.');
   ids.forEach(function(id){var A=S.apps[id];h+='<div class="row" data-i="'+id+'" style="cursor:pointer"><div class="mini" style="background:'+A.c+'">'+esc(A.e)+'</div><div class="nm">'+esc(A.n)+'</div><span style="color:var(--ac);font-weight:800">Editar ›</span></div>'});
   p.innerHTML=h;p.querySelectorAll('[data-i]').forEach(function(e){e.onclick=function(){PANELS.icons(p,e.dataset.i)}});return}
  var A=S.apps[sel];
  var h2='<div style="margin-bottom:6px"><button class="chip" id="bk">‹ Volver</button></div>'+head('Editar icono','')
   +'<div class="prev"><div class="ic" id="pv" style="background:'+A.c+'">'+esc(A.e)+'</div><div style="flex:1"><input type="text" id="an" maxlength="24" value="'+esc(A.n)+'"></div></div>'
   +'<h2>Emoji</h2><div class="chips" style="gap:6px">';
  EMOS.forEach(function(e){h2+='<button class="emo'+(A.e===e?' on':'')+'" data-e="'+e+'">'+e+'</button>'});
  h2+='</div><div style="margin-top:8px"><input type="text" id="ce" maxlength="4" placeholder="…o escribe tu propio emoji"></div><h2>Color</h2><div class="chips">';
  CARD.forEach(function(c){h2+='<div class="dots'+(A.c===c?' on':'')+'" data-c="'+c+'" style="background:'+c+'"></div>'});
  h2+='<input type="color" id="cc" value="'+(/^#[0-9a-f]{6}$/i.test(A.c)?A.c:'#ffc2dc')+'"></div>';
  p.innerHTML=h2;
  var upd=function(){save();paint();PANELS.icons(p,sel)};
  $('#bk').onclick=function(){PANELS.icons(p)};
  $('#an').onchange=function(){var v=this.value.trim();if(v){A.n=v.slice(0,24);save();paint()}};
  p.querySelectorAll('[data-e]').forEach(function(e){e.onclick=function(){A.e=e.dataset.e;upd()}});
  $('#ce').onchange=function(){var v=this.value.trim();if(v){A.e=Array.from(v).slice(0,2).join('');upd()}};
  p.querySelectorAll('[data-c]').forEach(function(e){e.onclick=function(){A.c=e.dataset.c;upd()}});
  $('#cc').onchange=function(){A.c=this.value;upd()}},
 org:function(p){
  var h=head('🗂️ Organizar','Mueve las aplicaciones y cambia los nombres de las carpetas.')+'<h2>Carpetas</h2>';
  Object.keys(S.folders).forEach(function(k){h+='<div class="row"><input type="text" data-f="'+k+'" maxlength="22" value="'+esc(S.folders[k].n)+'"></div>'});
  h+='<h2>Ubicación de las aplicaciones</h2>';
  var where=function(id){if(S.dock.indexOf(id)>=0&&S.home.indexOf(id)<0&&!inFolder(id))return'dock';var f=inFolder(id);return f||'home'};
  Object.keys(S.apps).forEach(function(id){var A=S.apps[id],w=inFolder(id)||(S.home.indexOf(id)>=0?'home':'home');
    h+='<div class="row"><div class="mini" style="background:'+A.c+'">'+esc(A.e)+'</div><div class="nm">'+esc(A.n)+'</div><select data-m="'+id+'"><option value="home"'+(w==='home'?' selected':'')+'>Inicio</option>';
    Object.keys(S.folders).forEach(function(k){h+='<option value="'+k+'"'+(w===k?' selected':'')+'>'+esc(S.folders[k].n)+'</option>'});h+='</select></div>'});
  h+='<h2>Dock</h2><div class="chips">';Object.keys(S.apps).forEach(function(id){var on=S.dock.indexOf(id)>=0;h+='<button class="chip'+(on?' on':'')+'" data-d="'+id+'">'+esc(S.apps[id].e)+' '+esc(S.apps[id].n)+'</button>'});
  h+='</div><div class="sub" style="margin-top:8px">Hasta 4 aplicaciones en el dock.</div><h2>Más</h2><button class="btn soft" id="edit">Reordenar arrastrando</button> <button class="btn line" id="reset">Restablecer todo</button>';
  p.innerHTML=h;
  p.querySelectorAll('[data-f]').forEach(function(e){e.onchange=function(){var v=this.value.trim();if(v){S.folders[e.dataset.f].n=v.slice(0,22);save();paint();PANELS.org(p)}}});
  p.querySelectorAll('[data-m]').forEach(function(e){e.onchange=function(){moveApp(e.dataset.m,this.value);save();paint();PANELS.org(p);toast('Movida ✓')}});
  p.querySelectorAll('[data-d]').forEach(function(e){e.onclick=function(){var id=e.dataset.d,i=S.dock.indexOf(id);if(i>=0)S.dock.splice(i,1);else if(S.dock.length<4)S.dock.push(id);else{toast('El dock admite 4 apps');return}save();paint();PANELS.org(p)}});
  $('#edit').onclick=function(){closeApp();setTimeout(function(){setEdit(true);toast('Arrastra los iconos · toca el nombre para renombrar')},350)};
  $('#reset').onclick=function(){if(confirm('¿Restablecer toda la pantalla de inicio?')){S=defState();try{localStorage.removeItem(IK)}catch(e){}save();paint();PANELS.org(p);toast('Restablecido')}}}
};
function inFolder(id){var ks=Object.keys(S.folders);for(var i=0;i<ks.length;i++){if(S.folders[ks[i]].items.indexOf(id)>=0)return ks[i]}return null}
function moveApp(id,to){var f=inFolder(id);if(f)S.folders[f].items.splice(S.folders[f].items.indexOf(id),1);var hi=S.home.indexOf(id);if(hi>=0)S.home.splice(hi,1);
  if(to==='home')S.home.push(id);else S.folders[to].items.push(id)}

/* ---------- Inicio ---------- */
load();paint();
window.__mpw={get S(){return S},openApp:openApp,closeApp:closeApp,setEdit:setEdit};
})();
</script>
