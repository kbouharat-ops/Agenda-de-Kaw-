<title>Agenda de Kaw</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: dot-grid desk; a ring-bound month page on the left, a column of tab cards (stats, exams, lists) on the right. */
:root{
  --bg:#F3F3F5; --dots:#C4C4CD; --paper:#FFFFFF; --pink:#EDEDF0; --pink-2:#F7F7F8;
  --powder:#C9C9D1; --rose:#E0578D; --rose-strong:#4B4B53; --on-rose:#FFFFFF;
  --ink:#34343B; --muted:#6B6B75; --line:#E3E3E8; --scrim:rgba(40,40,48,.4);
  --bow:#F4A6C3; --bow-soft:#FDE6EF; --petal:#FAC7DA; --gold:#FFE08F; --shadow:rgba(60,60,72,.22);
  --c-deberes-bg:#ECECEF; --c-deberes:#55555E;
  --c-examen-bg:#E3E3E8;  --c-examen:#3A3A43;
  --c-trabajo-bg:#E5E9EE; --c-trabajo:#465467;
  --c-festivo-bg:#F2EBDD; --c-festivo:#7A5A24;
  --c-personal-bg:#E7ECE6;--c-personal:#475A47;
  --pend-bg:#FCE4EE; --pend-fg:#B0356B; --pend-line:#F6C9DB; --pink-ink:#D6457F; --tick:#E0578D;
  --done-bg:#EEEEF1; --done-fg:#62626C; --danger:#B3363F;
  --font-script:'Pacifico','Brush Script MT',cursive;
  --font-display:'Fredoka','Nunito','Arial Rounded MT Bold',system-ui,sans-serif;
  --font-ui:'Nunito','Quicksand','Arial Rounded MT Bold',system-ui,sans-serif;
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--dots) 1.9px,transparent 2.3px);
  background-size:22px 22px;
  color:var(--ink); font:500 15px/1.5 var(--font-ui);
  padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body.lock{overflow:hidden}
.page{max-width:1220px;margin:0 auto;display:grid;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--rose);outline-offset:2px;border-radius:6px}
.ic{width:1em;height:1em;display:inline-block;flex:none;vertical-align:-.14em}
.ic.big{width:24px;height:24px}

/* Header */
.top{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;
  background:var(--pink);border-radius:24px;padding:18px 22px;overflow:hidden}
.brand{position:relative;z-index:1;min-width:0}
.logo{display:flex;align-items:center;gap:10px;margin:0;font:600 clamp(1.8rem,5.2vw,2.5rem)/1.15 var(--font-display);color:var(--pink-ink)}
.logo .ic{width:.7em;height:.7em}
.tag{margin:4px 0 0 2px;font:600 .68rem var(--font-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.top-r{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.deco{position:absolute;pointer-events:none;opacity:.8}
.pill-sync{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:7px 14px;font:600 .8rem var(--font-ui);color:var(--muted)}
.pill-sync i{width:9px;height:9px;border-radius:50%;background:var(--powder)}
.pill-sync.synced i{background:#5DBB8A}
.pill-sync.saving i{background:var(--rose);animation:pulse 1s infinite}
.pill-sync.offline i,.pill-sync.readonly i{background:#E2A04C}
@keyframes pulse{50%{opacity:.35}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:9px 16px;
  font:600 .92rem var(--font-ui);border:1.5px solid var(--line);background:var(--paper);color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--powder);background:var(--pink-2)}
.btn.primary{background:var(--rose-strong);border-color:var(--rose-strong);color:var(--on-rose)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:#E9C6C9}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.banner{background:var(--c-festivo-bg);color:var(--c-festivo);border-radius:14px;padding:10px 16px;font-weight:600;font-size:.9rem}

/* Stats strip */
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:7px 16px 7px 12px;font-weight:600;font-size:.9rem}
.stat b{font:700 1.35rem/1 var(--font-display);color:var(--rose-strong);font-variant-numeric:tabular-nums}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}
.main,.side{display:grid;gap:14px;min-width:0}

/* Toolbar */
.tools{display:grid;gap:10px}
.tools-row{display:flex;flex-wrap:wrap;gap:10px}
.search{position:relative;flex:1 1 220px;min-width:0}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input[type=text]{width:100%;padding:10px 40px 10px 40px;border:1.5px solid var(--line);border-radius:999px;background:var(--paper);font-size:16px}
.search input::placeholder{color:var(--muted)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center}
.chips-f{display:flex;flex-wrap:wrap;gap:8px}
.fchip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 13px;font-weight:600;font-size:.84rem}
.fchip .sw{width:9px;height:9px;border-radius:50%;background:var(--cf,var(--powder))}
.fchip[aria-pressed="true"]{background:var(--cb,var(--pink));border-color:var(--cf,var(--rose));color:var(--cf,var(--rose-strong))}
.res-note{margin:0;font-size:.85rem;color:var(--muted)}

.cat-deberes{--cb:var(--c-deberes-bg);--cf:var(--c-deberes)}
.cat-examen{--cb:var(--c-examen-bg);--cf:var(--c-examen)}
.cat-trabajo{--cb:var(--c-trabajo-bg);--cf:var(--c-trabajo)}
.cat-festivo{--cb:var(--c-festivo-bg);--cf:var(--c-festivo)}
.cat-personal{--cb:var(--c-personal-bg);--cf:var(--c-personal)}

/* Calendar page */
.cal{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:22px;padding:34px 16px 16px;box-shadow:0 14px 30px -20px var(--shadow)}
.cal::before{content:"";position:absolute;left:28px;right:28px;top:-9px;height:18px;
  background:radial-gradient(circle at 50% 50%,var(--bg) 0 3px,var(--powder) 3.5px 5.5px,transparent 6px) 0 0/26px 18px repeat-x}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-title{display:flex;align-items:center;gap:6px;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--rose-strong);flex:none}
.iconbtn:hover{background:var(--pink-2);border-color:var(--powder)}
.sel{position:relative;display:inline-flex;align-items:center}
.sel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:600 clamp(1.55rem,4.4vw,2.2rem)/1.1 var(--font-display);color:var(--ink);padding:2px 22px 2px 4px;cursor:pointer;border-radius:8px}
.sel select option{font:500 1rem var(--font-ui);color:var(--ink);background:var(--paper)}
.sel .ic{position:absolute;right:2px;pointer-events:none;color:var(--muted);width:16px;height:16px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{text-align:center;font:700 .72rem var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--rose-strong);padding:4px 0 6px}
.dow .s{display:none}
.day{appearance:none;display:flex;flex-direction:column;gap:4px;min-width:0;min-height:112px;overflow:hidden;text-align:left;
  border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 6px 5px;transition:border-color .12s,background .12s}
.day:hover{border-color:var(--powder);background:var(--pink-2)}
.day.out{background:var(--pink-2);opacity:.55}
.day.holiday{background:var(--c-festivo-bg)}
.num{font:700 .9rem var(--font-ui);width:26px;height:26px;display:grid;place-items:center;border-radius:50%;color:var(--ink);font-variant-numeric:tabular-nums;flex:none}
.day.today .num{background:var(--rose-strong);color:var(--on-rose)}
.chips{display:flex;flex-direction:column;gap:3px;min-width:0}
.chip{display:flex;align-items:center;gap:4px;min-width:0;font-size:.72rem;line-height:1.25;font-weight:600;padding:2px 6px;border-radius:7px;background:var(--cb);color:var(--cf)}
.day.holiday .chip.cat-festivo{background:transparent;padding-left:0}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip.pend{--cb:var(--pend-bg);--cf:var(--pend-fg)}
.chip.done{--cb:var(--done-bg);--cf:var(--done-fg)}
.chip.done .t{text-decoration:line-through;opacity:.8}
.chip .ic{width:12px;height:12px}
.more{font-size:.7rem;font-weight:700;color:var(--muted);padding-left:6px}
.dots{display:none;gap:3px;flex-wrap:wrap;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--cf)}
.dot.pend{--cf:#E8749F}
.dot.done{--cf:#B9B9C2}

/* Cards */
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 12px 26px -22px var(--shadow)}
.card h2{margin:0 0 10px;display:flex;align-items:center;gap:8px;font:600 1.45rem/1.1 var(--font-display);color:var(--ink)}
.card h2 .ic{color:var(--rose);width:20px;height:20px}
.empty{margin:0;padding:14px;border-radius:14px;background:var(--pink-2);color:var(--muted);font-size:.9rem;text-align:center}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.exam{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 12px 8px 8px}
.exam:hover{background:var(--pink-2);border-color:var(--powder)}
.leaf{width:48px;flex:none;border-radius:11px;overflow:hidden;text-align:center;background:var(--pend-bg);color:var(--pend-fg);line-height:1;padding-bottom:6px}
.leaf small{display:block;background:var(--pend-fg);color:#fff;font:700 .62rem var(--font-ui);letter-spacing:.14em;text-transform:uppercase;padding:3px 0;margin-bottom:5px}
.leaf b{font:700 1.4rem var(--font-display)}
.exam .tt{display:block;font-weight:700;overflow-wrap:anywhere}
.exam .sub{display:block;font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:6px;background:var(--pink-2);border-radius:999px;padding:4px;margin-bottom:12px}
.tab{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:999px;padding:7px 4px;font:700 .78rem var(--font-ui);color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--paper);color:var(--rose-strong);box-shadow:0 2px 8px -4px var(--shadow)}
.panel{max-height:430px;overflow:auto;padding:2px}

/* Task rows */
.row{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--paper)}
.row.past{opacity:.6}
.row.done .r-title span{text-decoration:line-through;opacity:.7}
.row.pend{background:var(--pend-bg);border-color:var(--pend-line)}
.row.pend .st{background:var(--paper)}
.row.overdue{border-color:var(--pend-fg)}
.st{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--pink-2);display:grid;place-items:center}
.st:hover{background:var(--pink)}
.st[disabled]{cursor:default}
.cdot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--cf);margin:11px 11px 0 11px}
.r-main{flex:1 1 auto;min-width:0;display:grid;gap:2px;text-align:left;border:0;background:transparent;padding:2px 0}
button.r-main:hover .r-title{color:var(--rose-strong)}
.r-title{display:flex;align-items:center;gap:6px;font-weight:700;overflow-wrap:anywhere}
.r-title .ic{color:var(--rose);flex:none}
.r-meta{font-size:.78rem;color:var(--muted)}
.r-meta .cat{color:var(--cf);font-weight:700}
.r-desc{font-size:.84rem;color:var(--ink);opacity:.82;overflow-wrap:anywhere;white-space:pre-wrap}
.r-acts{display:flex;gap:4px;flex:none}
.mini{min-width:32px;height:32px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 7px;color:var(--muted);font:700 .75rem var(--font-ui)}
.mini:hover{border-color:var(--powder);color:var(--rose-strong)}
.mini[aria-pressed="true"]{color:var(--rose-strong);background:var(--pink-2);border-color:var(--powder)}
.mini.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.idle,.sure{display:inline-flex;align-items:center;gap:6px}
.sure{display:none}
.armed .idle{display:none}
.armed .sure{display:inline-flex}

/* Modal */
.overlay{position:fixed;inset:0;z-index:50;background:var(--scrim);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;
  padding-top:env(safe-area-inset-top,0px)}
.sheet{position:relative;width:min(600px,100%);max-height:94%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:26px 26px 0 0;
  padding:22px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px -10px var(--shadow)}
.sheet::before{content:"";display:block;height:5px;width:46px;border-radius:5px;background:var(--powder);margin:-8px auto 14px}
.x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--muted)}
.eyebrow{margin:0;font:700 .68rem var(--font-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--rose-strong)}
.sheet h2{margin:2px 40px 2px 0;font:600 clamp(1.5rem,5vw,2rem)/1.1 var(--font-display)}
.sheet-sub{margin:0 0 14px;color:var(--muted);font-size:.9rem}
.sheet h3{margin:18px 0 10px;font:600 1.3rem var(--font-display);display:flex;align-items:center;gap:8px}
.sheet h3 .ic{color:var(--rose);width:18px;height:18px}
form{display:grid;gap:12px;border-top:2px dotted var(--powder);margin-top:16px;padding-top:2px}
label,legend{font:700 .82rem var(--font-ui);color:var(--muted);display:block;margin-bottom:4px;padding:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
input[type=text],input[type=date],input[type=time],textarea{width:100%;min-width:0;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);font-size:16px;color:var(--ink)}
textarea{resize:vertical;min-height:72px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2.5px solid var(--rose);outline-offset:1px}
.err{margin:0;color:var(--danger);font-weight:700;font-size:.86rem}
.cats,.togs{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;margin:0;display:inline-block}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font:700 .85rem var(--font-ui);color:var(--muted);background:var(--paper)}
.opt input:checked + span{background:var(--cb,var(--pink));border-color:var(--cf,var(--rose));color:var(--cf,var(--rose-strong))}
.opt input:focus-visible + span{outline:2.5px solid var(--rose);outline-offset:2px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.steps{margin:10px 0 0;padding-left:1.2rem;display:grid;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:80;
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

.stat{font-family:inherit;color:var(--ink);text-align:left}
button.stat:hover{border-color:var(--powder);background:var(--pink-2)}
.stat.on{background:var(--pend-bg);border-color:var(--pend-line)}
#go-done.on{background:var(--done-bg);border-color:var(--powder)}
.lv{max-width:860px;width:100%;margin:0 auto}
.lv-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.lv-sw{margin:0}
.lv-sw .tab{padding:7px 14px}
.lv-sw .tab[aria-pressed="true"]{background:var(--paper);color:var(--rose-strong);box-shadow:0 2px 8px -4px var(--shadow)}
.lv-card h2{font-size:1.9rem;margin:18px 0 4px;outline:none}
.grp{margin:18px 0 8px;font:600 1rem var(--font-display);color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#go-notes.on{background:var(--pink);border-color:var(--powder)}
.nb{max-width:1000px;width:100%;margin:0 auto}
.nb-card h2{display:flex;align-items:center;gap:8px;font-size:1.9rem;margin:18px 0 4px;outline:none}
.nb-card h2 .ic{width:26px;height:26px}
.nb-grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start;margin-top:12px}
.nb-side,.nb-ed,.nb-form{display:grid;gap:10px;min-width:0}
.nb-list{max-height:560px;overflow:auto;padding:2px}
.note-item{display:grid;gap:2px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 12px;min-width:0}
.note-item:hover{border-color:var(--powder);background:var(--pink-2)}
.note-item[aria-current="true"]{border-color:var(--rose);background:var(--pink-2)}
.ni-t{display:flex;align-items:center;gap:6px;font-weight:800;overflow-wrap:anywhere}
.ni-t .ic{flex:none;width:18px;height:18px}
.ni-p{font-size:.84rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni-d{font-size:.72rem;color:var(--muted);letter-spacing:.04em}
#nb-t{font:600 1.35rem var(--font-display);padding:10px 14px;border-radius:14px}
#nb-b{min-height:420px;resize:vertical;line-height:32px;padding:0 14px 0 54px;border-radius:14px;
  background-color:var(--paper);
  background-image:linear-gradient(90deg,transparent 40px,var(--pend-line) 40px,var(--pend-line) 42px,transparent 42px),repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);
  background-attachment:local}
.nb-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#nb-status{font-size:.82rem;color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--pend-bg);border-color:var(--pend-line);color:var(--pend-fg)}
.nb-mobback{display:none;justify-self:start}
@media (max-width:700px){
  .nb-grid{grid-template-columns:minmax(0,1fr)}
  .nb-grid.show-ed .nb-side{display:none}
  .nb-grid:not(.show-ed) .nb-ed{display:none}
  .nb-mobback{display:inline-flex}
  #nb-b{min-height:340px}
}
@media (min-width:701px){
  .overlay{align-items:center;padding:24px}
  .sheet{border-radius:26px}
  .sheet::before{display:none}
}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:700px){
  .top{padding:16px}
  .cal{padding:30px 10px 12px}
  .grid{gap:4px}
  .dow .l{display:none}.dow .s{display:inline}
  .day{min-height:60px;align-items:center;padding:4px 2px;gap:3px}
  .chips{display:none}
  .dots{display:flex}
  .row3{grid-template-columns:1fr 1fr}
  .row3 > :last-child{grid-column:1 / -1}
  .r-acts{flex-wrap:wrap;justify-content:flex-end;max-width:120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="clip-half"><rect x="0" y="12.6" width="24" height="12"/></clipPath>
    <symbol id="i-bow" viewBox="0 0 24 24">
      <g fill="none" stroke="var(--rose)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11.4 13.9c-.5 2.6-1.9 4.8-4 6.7"/>

<script>
(function(){
'use strict';
var MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var DOWS=[['Lun','L'],['Mar','M'],['Mié','X'],['Jue','J'],['Vie','V'],['Sáb','S'],['Dom','D']];
var CATS={deberes:'Deberes',examen:'Examen',trabajo:'Trabajo',festivo:'Festivo',personal:'Personal'};
var NS='http://www.w3.org/2000/svg';
var LOCAL_KEY='my-pink-planner-local-v1';

function $(s){return document.querySelector(s)}
function pad(n){return String(n).padStart(2,'0')}
function ds(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function todayStr(){var t=new Date();return ds(t.getFullYear(),t.getMonth(),t.getDate())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function utc(s){var p=s.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])}
function dayDiff(a,b){return Math.round((utc(a)-utc(b))/864e5)}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function fmtLong(s){return cap(parse(s).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}
function fmtShort(s){
  var d=parse(s),o={weekday:'short',day:'numeric',month:'short'};
  if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';
  return d.toLocaleDateString('es-ES',o).replace(/\./g,'');
}
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)}
function newId(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function h(tag,attrs){
  var e=document.createElement(tag),k,v,kids=Array.prototype.slice.call(arguments,2);
  for(k in (attrs||{})){
    v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  (function add(list){
    list.forEach(function(c){
      if(c==null||c===false)return;
      if(Array.isArray(c))return add(c);
      e.append(c.nodeType?c:document.createTextNode(String(c)));
    });
  })(kids);
  return e;
}
function ic(name,cls){
  var s=document.createElementNS(NS,'svg'),u=document.createElementNS(NS,'use');
  s.setAttribute('class','ic'+(cls?' '+cls:''));
  s.setAttribute('aria-hidden','true');
  u.setAttribute('href','#i-'+name);
  s.appendChild(u);
  return s;
}

/* ---------- State ---------- */
var S={tasks:new Map(),mode:'loading',canWrite:true,col:null,sync:'loading',loaded:false};
var today=todayStr();
var t0=new Date();
var view={y:t0.getFullYear(),m:t0.getMonth()};
var filter={q:'',cat:'all'};
var tab='pending';
var modal={date:null,editId:null,returnFocus:null};
var queue=new Map();
var route='cal';
var N={notes:new Map(),currentId:null,isNew:false,dirty:false,timer:null,q:'',loaded:false};

function normalize(id,raw){
  if(!raw||typeof raw!=='object')return null;
  if(!validDate(raw.date))return null;
  var end=validDate(raw.end)&&raw.end>raw.date?raw.end:'';
  return {
    id:id,
    title:String(raw.title||'').slice(0,80)||'(sin título)',
    desc:String(raw.desc||'').slice(0,500),
    cat:CATS[raw.cat]?raw.cat:'personal',
    date:raw.date,end:end,
    time:/^\d{2}:\d{2}$/.test(raw.time||'')?raw.time:'',
    done:!!raw.done,important:!!raw.important,
    updatedAt:Number(raw.updatedAt)||0
  };
}
function all(){return Array.from(S.tasks.values())}
function matches(t){
  if(filter.cat!=='all'&&t.cat!==filter.cat)return false;
  var q=filter.q.trim().toLowerCase();
  if(!q)return true;
  return (t.title+' '+t.desc+' '+CATS[t.cat]).toLowerCase().indexOf(q)>=0;
}
function byTime(a,b){
  return ((a.cat==='festivo')?0:1)-((b.cat==='festivo')?0:1)
    || (a.time||'99:99').localeCompare(b.time||'99:99')
    || a.title.localeCompare(b.title,'es');
}
function byDateAsc(a,b){return a.date.localeCompare(b.date)||(a.time||'99:99').localeCompare(b.time||'99:99')||a.title.localeCompare(b.title,'es')}
function byDateDesc(a,b){return b.date.localeCompare(a.date)||a.title.localeCompare(b.title,'es')}
function tasksOn(list,d){return list.filter(function(t){return t.date<=d&&(t.end||t.date)>=d}).sort(byTime)}
function plural(n,one,many){return n+' '+(n===1?one:many)}

/* ---------- Toast ---------- */
var toastTimer;
function toast(msg){
  var el=$('#toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove('show')},2400);
}

/* ---------- Persistence ---------- */
function saveLocal(){
  try{
    var data=all().map(function(t){return t});
    localStorage.setItem(LOCAL_KEY,JSON.stringify(data));
  }catch(e){}
}
function loadLocal(){
  try{
    var raw=JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]');
    S.tasks=new Map();
    raw.forEach(function(r){var t=normalize(r.id||newId(),r);if(t)S.tasks.set(t.id,t)});
  }catch(e){}
}
function enqueue(id,fn){
  var prev=queue.get(id)||Promise.resolve();
  var p=prev.catch(function(){}).then(fn);
  queue.set(id,p.catch(function(){}));
  return p;
}
function fail(e){
  if(e&&e.code==='invalid_argument'){S.canWrite=false;S.sync='readonly'}
  toast(S.canWrite?'No se pudo guardar. Inténtalo de nuevo.':'No tienes permiso para cambiar la agenda.');
  renderAll();
  return false;
}
function bodyOf(t){
  return {title:t.title,desc:t.desc,cat:t.cat,date:t.date,end:t.end||'',time:t.time||'',done:!!t.done,important:!!t.important,updatedAt:Date.now()};
}
async function persist(t){
  var body=bodyOf(t);
  if(S.col){
    try{await enqueue(t.id,function(){return S.col.doc(t.id).set(body)});return true}
    catch(e){return fail(e)}
  }
  var n=normalize(t.id,body);
  S.tasks.set(t.id,n);saveLocal();renderAll();return true;
}
async function removeTask(id){
  if(S.col){
    try{await enqueue(id,function(){return S.col.doc(id).delete()});return true}
    catch(e){return fail(e)}
  }
  S.tasks.delete(id);saveLocal();renderAll();return true;
}
function toggleDone(id){
  var t=S.tasks.get(id);if(!t||!S.canWrite)return;
  var nd=!t.done;
  persist(Object.assign({},t,{done:nd})).then(function(ok){if(ok)toast(nd?'¡Tarea completada!':'Vuelve a estar pendiente')});
}
function toggleStar(id){

function delBtn(run,idleKids,sureText,cls,label){

/* ---------- Cuaderno de notas ---------- */
var NOTES_KEY='my-pink-planner-notes-v1';
function normNote(id,raw){
  if(!raw||typeof raw!=='object')return null;
  return {id:id,title:String(raw.title||'').slice(0,100),body:String(raw.body||'').slice(0,20000),pinned:!!raw.pinned,
    createdAt:Number(raw.createdAt)||0,updatedAt:Number(raw.updatedAt)||0};
}
function saveLocalNotes(){try{localStorage.setItem(NOTES_KEY,JSON.stringify(Array.from(N.notes.values())))}catch(e){}}
function loadLocalNotes(){
  try{
    var raw=JSON.parse(localStorage.getItem(NOTES_KEY)||'[]');
    N.notes=new Map();
    raw.forEach(function(r){var n=normNote(r.id||newId(),r);if(n)N.notes.set(n.id,n)});
  }catch(e){}
}
async function persistNote(n){
  var now=Date.now();
  var b={title:n.title,body:n.body,pinned:!!n.pinned,createdAt:n.createdAt||now,updatedAt:now};
  if(S.db){
    try{await enqueue('n:'+n.id,function(){return S.db.collection('notes').doc(n.id).set(b)});return true}
    catch(e){return fail(e)}
  }
  N.notes.set(n.id,normNote(n.id,b));saveLocalNotes();renderStats();renderNotebook(true);return true;
}
async function removeNote(id){
  if(S.db){
    try{await enqueue('n:'+id,function(){return S.db.collection('notes').doc(id).delete()});return true}
    catch(e){return fail(e)}
  }
  N.notes.delete(id);saveLocalNotes();renderStats();renderNotebook(true);return true;
}
function isWide(){try{return window.matchMedia('(min-width:701px)').matches}catch(e){return true}}
function sortedNotes(){
  return Array.from(N.notes.values()).sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)||b.updatedAt-a.updatedAt});
}
function noteDate(n){
  return n.updatedAt?new Date(n.updatedAt).toLocaleDateString('es-ES',{day:'numeric',month:'short'}).replace('.',''):'';
}
function setNbStatus(t){var e=$('#nb-status');if(e)e.textContent=t}
function flushNote(){
  if(N.timer){clearTimeout(N.timer);N.timer=null}
  if(N.dirty)return saveCurrent();
  return Promise.resolve();
}
async function saveCurrent(){
  if(N.timer){clearTimeout(N.timer);N.timer=null}
  if(!S.canWrite||!N.currentId){N.dirty=false;return}
  var title=$('#nb-t').value,body=$('#nb-b').value,id=N.currentId;
  var ex=N.notes.get(id);
  if(!ex&&!title.trim()&&!body.trim()){N.dirty=false;setNbStatus('');return}
  N.dirty=false;
  setNbStatus('Guardando…');
  var ok=await persistNote({id:id,title:title,body:body,pinned:ex?ex.pinned:false,createdAt:ex?ex.createdAt:0});
  if(N.currentId===id)N.isNew=false;
  if(ok&&!N.dirty)setNbStatus('Guardado');
}
function renderNoteList(notes){
  var ul=$('#nb-list');ul.replaceChildren();
  var q=N.q.trim().toLowerCase();
  var items=q?notes.filter(function(n){return (n.title+' '+n.body).toLowerCase().indexOf(q)>=0}):notes;
  var draft=N.isNew&&N.currentId&&!N.notes.has(N.currentId);
  if(draft){
    ul.append(h('li',null,h('button',{type:'button',class:'note-item','aria-current':'true'},
      h('span',{class:'ni-t'},h('span',null,'Nota nueva')),h('span',{class:'ni-p'},'Empieza a escribir…'))));
  }
  if(!N.loaded&&!notes.length){ul.append(h('li',null,h('p',{class:'empty'},'Cargando tus notas…')));return}
  if(!items.length&&!draft){
    ul.append(h('li',null,h('p',{class:'empty'},notes.length?'No hay notas con esa búsqueda.':(S.canWrite?'Todavía no hay notas. Pulsa «Nueva nota» para empezar.':'Todavía no hay notas.'))));
  }
  items.forEach(function(n){
    var prev=n.body.replace(/\s+/g,' ').trim().slice(0,90);
    ul.append(h('li',null,h('button',{type:'button',class:'note-item','aria-current':String(n.id===N.currentId),onclick:function(){openNote(n.id)}},
      h('span',{class:'ni-t'},n.pinned?ic('bow'):null,h('span',null,n.title.trim()||'Sin título')),
      h('span',{class:'ni-p'},prev||'Sin texto'),
      h('span',{class:'ni-d'},noteDate(n)))));
  });
}
function syncEditor(force){
  var has=!!N.currentId,n=has?N.notes.get(N.currentId):null;
  $('#nb-form').hidden=!has;$('#nb-empty').hidden=has;
  $('#nb-grid').classList.toggle('show-ed',has);
  if(!has)return;
  var ro=!S.canWrite,t=$('#nb-t'),b=$('#nb-b');
  t.readOnly=ro;b.readOnly=ro;
  var busy=N.dirty||t===document.activeElement||b===document.activeElement;
  if(force||!busy){
    var nt=n?n.title:'',nb=n?n.body:'';
    if(force||t.value!==nt)t.value=nt;
    if(force||b.value!==nb)b.value=nb;
  }
  var pin=$('#nb-pin');
  pin.hidden=ro;pin.disabled=!n;pin.setAttribute('aria-pressed',String(!!(n&&n.pinned)));
  var slot=$('#nb-del-slot');
  if(ro){slot.replaceChildren()}
  else if(force||!slot.firstChild){
    slot.replaceChildren(delBtn(deleteCurrent,[ic('trash'),'Eliminar nota'],'¿Seguro? Pulsa otra vez','btn danger','Eliminar nota'));
  }
}
function renderNotebook(fromRemote){
  if(route!=='notes')return;
  $('#nb-new').hidden=!S.canWrite;
  var notes=sortedNotes();
  if(N.currentId&&!N.isNew&&!N.notes.has(N.currentId)&&N.loaded)N.currentId=null;
  if(!N.currentId&&!N.isNew&&notes.length&&N.loaded&&isWide()){
    N.currentId=notes[0].id;syncEditor(true);
  }else{
    syncEditor(false);
  }
  renderNoteList(notes);
}
function openNote(id){
  flushNote();

function newNote(){

async function deleteCurrent(){
  var id=N.currentId;if(!id)return;
  if(N.timer){clearTimeout(N.timer);N.timer=null}

  if(!N.notes.has(id)){N.currentId=null;N.isNew=false;setNbStatus('');renderNotebook(true);return}

async function togglePin(){

  var id=modal.editId;
  slot.append(delBtn(function(){
    removeTask(id).then(function(ok){if(ok){toast('Tarea eliminada');resetForm(modal.date)}});
  },[ic('trash'),'Eliminar tarea'],'¿Seguro? Pulsa otra vez','btn danger','Eliminar tarea'));
}
function showErr(msg){var e=$('#f-err');e.hidden=!msg;e.textContent=msg||''}

/* ---------- Events ---------- */
function bind(){
  var sm=$('#sel-month'),sy=$('#sel-year');
  MONTHS.forEach(function(n,i){sm.append(h('option',{value:String(i)},n))});
  for(var y=2020;y<=2040;y++)sy.append(h('option',{value:String(y)},String(y)));
  sm.addEventListener('change',function(){view.m=+sm.value;renderCal()});
  sy.addEventListener('change',function(){view.y=+sy.value;renderCal()});
  function shift(n){view.m+=n;if(view.m<0){view.m=11;view.y--}if(view.m>11){view.m=0;view.y++}renderCal()}
  $('#go-pend').addEventListener('click',function(){goRoute('pend')});
  $('#go-done').addEventListener('click',function(){goRoute('done')});
  $('#lv-back').addEventListener('click',function(){goRoute('cal')});
  $('#go-notes').addEventListener('click',function(){goRoute('notes')});
  $('#nb-back').addEventListener('click',function(){goRoute('cal')});
  $('#nb-new').addEventListener('click',newNote);
  $('#nb-pin').addEventListener('click',togglePin);
  $('#nb-t').addEventListener('input',onNoteInput);
  $('#nb-b').addEventListener('input',onNoteInput);
  $('#nb-q').addEventListener('input',function(){N.q=$('#nb-q').value;renderNoteList(sortedNotes())});
  $('#nb-listback').addEventListener('click',function(){flushNote();N.currentId=null;N.isNew=false;setNbStatus('');syncEditor(true);renderNoteList(sortedNotes())});
  window.addEventListener('pagehide',function(){flushNote()});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flushNote()});
  $('#lv-sw-pend').addEventListener('click',function(){goRoute('pend')});
  $('#lv-sw-done').addEventListener('click',function(){goRoute('done')});
  window.addEventListener('hashchange',function(){applyRoute(routeFromHash())});
  $('#prev').addEventListener('click',function(){shift(-1)});
  $('#next').addEventListener('click',function(){shift(1)});
  $('#btn-today').addEventListener('click',function(){
    today=todayStr();var n=new Date();view.y=n.getFullYear();view.m=n.getMonth();renderAll();
  });
  $('#grid').addEventListener('click',function(e){
    var b=e.target.closest('.day');if(b)openDay(b.dataset.date,null,b);
  });
  $('#btn-new').addEventListener('click',function(e){
    var n=new Date(),inView=n.getFullYear()===view.y&&n.getMonth()===view.m;
    openDay(inView?todayStr():ds(view.y,view.m,1),null,e.currentTarget);
  });

  var fl=$('#filters');
  [['all','Todas']].concat(Object.keys(CATS).map(function(k){return [k,CATS[k]]})).forEach(function(p){
    fl.append(h('button',{type:'button',class:'fchip'+(p[0]!=='all'?' cat-'+p[0]:''),'data-cat':p[0],'aria-pressed':String(p[0]==='all')},
      p[0]!=='all'?h('span',{class:'sw'}):null,p[1]));
  });
  fl.addEventListener('click',function(e){
    var b=e.target.closest('.fchip');if(!b)return;
    filter.cat=b.dataset.cat;
    fl.querySelectorAll('.fchip').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});
    renderCal();renderLists();renderNote();
  });
  var q=$('#q');
  q.addEventListener('input',function(){filter.q=q.value;renderCal();renderLists();renderNote()});
  $('#q-clr').addEventListener('click',function(){q.value='';filter.q='';renderCal();renderLists();renderNote();q.focus()});

  document.querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click',function(){tab=b.dataset.tab;renderLists()});
  });

  $('#m-close').addEventListener('click',closeModal);
  $('#modal').addEventListener('mousedown',function(e){if(e.target===e.currentTarget)closeModal()});
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(!$('#modal').hidden)closeModal();
  });

  document.querySelectorAll('input[name=cat]').forEach(function(r){
    r.addEventListener('change',function(){$('#tog-done').hidden=(r.value==='festivo')});
  });
  $('#f-cancel').addEventListener('click',function(){resetForm(modal.date);$('#f-title').focus()});
  $('#task-form').addEventListener('submit',async function(e){
    e.preventDefault();
    if(!S.canWrite)return;
    var title=$('#f-title').value.trim();
    if(!title){showErr('Escribe un título para la tarea.');$('#f-title').focus();return}
    var date=$('#f-date').value;
    if(!validDate(date)){showErr('Elige una fecha.');$('#f-date').focus();return}
    var end=$('#f-end').value;if(!validDate(end)||end<=date)end='';
    var catEl=document.querySelector('input[name=cat]:checked');
    var cat=catEl?catEl.value:'deberes';
    var editing=!!modal.editId;
    var prev=editing?S.tasks.get(modal.editId):null;
    var t={id:modal.editId||newId(),title:title,desc:$('#f-desc').value.trim(),cat:cat,date:date,end:end,time:$('#f-time').value,
      important:$('#f-important').checked,done:cat==='festivo'?false:$('#f-done').checked};
    $('#f-save').disabled=true;
    var ok=await persist(t);
    $('#f-save').disabled=false;
    if(!ok)return;
    toast(editing?'Cambios guardados':'Tarea añadida');
    modal.date=date;
    var p=parse(date);view.y=p.getFullYear();view.m=p.getMonth();
    resetForm(date);renderAll();
    $('#f-title').focus();
  });
}

/* ---------- Boot ---------- */
async function use(name){
  try{
    if(window.claude&&typeof window.claude.use==='function')return await window.claude.use(name);
  }catch(e){}
  return null;
}
async function init(){
  bind();
  applyRoute(routeFromHash());
  renderAll();
  var db=await use('db');
  var user=await use('user');
  if(user){
    try{var c=await user.can('data.write');if(c===false)S.canWrite=false}catch(e){}
  }
  if(!db){
    S.mode='local';S.sync='local';S.loaded=true;loadLocal();loadLocalNotes();N.loaded=true;renderAll();return;
  }
  S.mode='shared';S.col=db.collection('tasks');
  if(!S.canWrite)S.sync='readonly';
  var timer=setTimeout(function(){
    if(!S.loaded){S.sync=S.canWrite?'offline':'readonly';renderSync()}
  },10000);
  S.db=db;
  db.collection('notes').onSnapshot(function(snap){
    var map=new Map();
    snap.docs.forEach(function(d){var n=normNote(d.id,d.data());if(n)map.set(d.id,n)});
    N.notes=map;
    if(!snap.metadata.fromCache||map.size)N.loaded=true;
    renderStats();renderNotebook(true);
  },function(){N.loaded=true;renderNotebook(true)});
  S.col.onSnapshot(function(snap){
    var map=new Map();
    snap.docs.forEach(function(d){var t=normalize(d.id,d.data());if(t)map.set(d.id,t)});
    S.tasks=map;
    if(!snap.metadata.fromCache){S.loaded=true;clearTimeout(timer)}
    if(!S.canWrite)S.sync='readonly';
    else if(snap.metadata.hasPendingWrites)S.sync='saving';
    else if(snap.metadata.fromCache&&!S.loaded)S.sync='loading';
    else S.sync='synced';
    if(S.loaded||map.size)S.loaded=true;
    renderAll();
  },function(err){
    clearTimeout(timer);
    S.sync='offline';S.loaded=true;renderAll();
  });
}
init();
})();
</script>
